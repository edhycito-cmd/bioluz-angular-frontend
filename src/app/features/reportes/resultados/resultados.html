<app-page-header title="Reporte de resultados" subtitle="Consulta y exportación de los resultados registrados." icon="pi pi-chart-bar">
  <p-button label="Exportar" icon="pi pi-download" severity="secondary" [outlined]="true" (onClick)="exportCSV()" />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-surface bg-surface-0 dark:bg-surface-900">
  <div class="flex flex-col gap-3 border-b border-surface p-3 sm:flex-row sm:items-center sm:justify-between sm:p-4">
    <p-iconfield class="w-full sm:w-80">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        class="w-full"
        aria-label="Buscar resultados"
        placeholder="Buscar resultados..."
        (input)="onGlobalFilter(dt, $event)"
      />
    </p-iconfield>
  </div>


<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="[
    'examen',
    'informe',
    'valorTexto',
    'interpretacion',
    'documento'
  ]"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} resultados"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '70rem' }"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="examen" style="min-width: 18rem">
        Examen <p-sortIcon field="examen" />
      </th>
      <th pSortableColumn="informe" style="min-width: 14rem">
        Informe <p-sortIcon field="informe" />
      </th>
      <th pSortableColumn="valorNumerico" style="min-width: 10rem">
        Valor numérico <p-sortIcon field="valorNumerico" />
      </th>
      <th pSortableColumn="valorTexto" style="min-width: 14rem">
        Valor texto <p-sortIcon field="valorTexto" />
      </th>
      <th pSortableColumn="interpretacion" style="min-width: 18rem">
        Interpretación <p-sortIcon field="interpretacion" />
      </th>
      <th pSortableColumn="documento" style="min-width: 14rem">
        Documento <p-sortIcon field="documento" />
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-resultado>
    <tr>
      <td data-label="Examen">{{ resultado.examen }}</td>
      <td data-label="Informe">{{ resultado.informe }}</td>
      <td data-label="Valor numérico">{{ resultado.valorNumerico ?? "—" }}</td>
      <td data-label="Valor texto">{{ resultado.valorTexto || "—" }}</td>
      <td data-label="Interpretación">{{ resultado.interpretacion || "—" }}</td>
      <td data-label="Documento">{{ resultado.documento || "—" }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6">
        <app-empty-state icon="pi pi-chart-bar" title="No hay resultados registrados" description="Cuando existan registros aparecerán aquí." />
      </td>
    </tr>
  </ng-template>
</p-table>
</div>
