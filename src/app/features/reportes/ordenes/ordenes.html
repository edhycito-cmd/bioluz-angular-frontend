<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <div class="flex flex-wrap items-center gap-2">
      <span class="font-semibold text-xl mr-2">Reporte de órdenes</span>
    </div>
  </ng-template>
  <ng-template #end>
    <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row">
      <p-iconfield class="w-full sm:w-auto">
        <p-inputicon styleClass="pi pi-search" />
        <input
          pInputText
          type="text"
          class="w-full sm:w-64"
          (input)="onGlobalFilter(dt, $event)"
          placeholder="Buscar..."
        />
      </p-iconfield>
      <p-button
        label="Exportar"
        icon="pi pi-upload"
        severity="secondary"
        (onClick)="exportCSV()"
      />
    </div>
  </ng-template>
</p-toolbar>

<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="[
    'nroFolio',
    'fechaFormateada',
    'paciente',
    'medico',
    'sucursal',
    'institucion',
    'estado'
  ]"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} órdenes"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '76rem' }"
>
  <ng-template #caption>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h5 class="m-0">Órdenes de laboratorio</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="nroFolio" style="min-width: 8rem">
        Folio <p-sortIcon field="nroFolio" />
      </th>
      <th pSortableColumn="fechaFormateada" style="min-width: 10rem">
        Fecha <p-sortIcon field="fechaFormateada" />
      </th>
      <th pSortableColumn="paciente" style="min-width: 12rem">
        Paciente <p-sortIcon field="paciente" />
      </th>
      <th pSortableColumn="medico" style="min-width: 16rem">
        Médico <p-sortIcon field="medico" />
      </th>
      <th pSortableColumn="sucursal" style="min-width: 16rem">
        Sucursal <p-sortIcon field="sucursal" />
      </th>
      <th pSortableColumn="institucion" style="min-width: 16rem">
        Institución <p-sortIcon field="institucion" />
      </th>
      <th pSortableColumn="estado" style="min-width: 10rem">
        Estado <p-sortIcon field="estado" />
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-orden>
    <tr>
      <td data-label="Folio">{{ orden.nroFolio }}</td>
      <td data-label="Fecha">{{ orden.fechaFormateada }}</td>
      <td data-label="Paciente">{{ orden.paciente }}</td>
      <td data-label="Médico">{{ orden.medico }}</td>
      <td data-label="Sucursal">{{ orden.sucursal }}</td>
      <td data-label="Institución">{{ orden.institucion }}</td>
      <td data-label="Estado">
        <p-tag [value]="orden.estado" severity="info" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7" class="text-center py-6">
        No hay órdenes registradas.
      </td>
    </tr>
  </ng-template>
</p-table>
