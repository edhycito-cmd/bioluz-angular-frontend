<p-toast />
<p-confirmdialog [style]="{ width: 'min(450px, calc(100vw - 2rem))' }" />

<app-page-header title="Pacientes" subtitle="Registro de pacientes vinculados a una persona." icon="pi pi-user">
  <p-button label="Exportar" icon="pi pi-download" severity="secondary" [outlined]="true" (onClick)="exportCSV()" />
  <p-button label="Nuevo" icon="pi pi-plus" *appHasPermission="'create'" (onClick)="openNew()" />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-surface bg-surface-0 dark:bg-surface-900">
  <div class="flex flex-col gap-3 border-b border-surface p-3 sm:flex-row sm:items-center sm:justify-between sm:p-4">
    <p-iconfield class="w-full sm:w-80">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        class="w-full"
        aria-label="Buscar pacientes"
        placeholder="Buscar pacientes..."
        (input)="onGlobalFilter(dt, $event)"
      />
    </p-iconfield>
  </div>


<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="['codigo', 'persona', 'estado']"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} pacientes"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '44rem' }"
  selectionMode="multiple"
  [(selection)]="seleccionados"
>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="codigo" style="min-width: 10rem">
        Código <p-sortIcon field="codigo" />
      </th>
      <th pSortableColumn="persona" style="min-width: 24rem">
        Persona <p-sortIcon field="persona" />
      </th>
      <th pSortableColumn="estado" style="min-width: 8rem">
        Estado <p-sortIcon field="estado" />
      </th>
      <th style="min-width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-paciente>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="paciente" />
      </td>
      <td data-label="Código">{{ paciente.codigo }}</td>
      <td data-label="Persona">{{ paciente.persona }}</td>
      <td data-label="Estado">
        <p-tag
          [value]="paciente.estado"
          [severity]="paciente.esActivo ? 'success' : 'secondary'"
        />
      </td>
      <td>
        <p-button
          icon="pi pi-pencil"
          ariaLabel="Editar"
          class="mr-2"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'update'"
          (onClick)="editPaciente(paciente)"
        />
        <p-button
          icon="pi pi-trash"
          ariaLabel="Eliminar"
          severity="danger"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'delete'"
          (onClick)="eliminar(paciente)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="12">
        <app-empty-state
          icon="pi pi-user"
          title="Sin resultados"
          description="No hay pacientes para mostrar. Ajuste la búsqueda o cree un nuevo registro."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [style]="{ width: 'min(540px, calc(100vw - 2rem))' }"
  [header]="esNuevo ? 'Nuevo paciente' : 'Editar paciente'"
  [modal]="true"
>
  <div class="flex flex-col gap-5 pt-2">
    <div>
      <label for="idPersona" class="mb-1.5 block text-sm font-medium">
        Persona <span class="text-red-500">*</span>
      </label>
      <p-select
        inputId="idPersona"
        [options]="personaOptions()"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="paciente.idPersona"
        placeholder="Seleccione una persona"
        appendTo="body"
        fluid
      />
      <small class="text-surface-500">
        El paciente se vincula a una persona ya registrada.
      </small>
      @if (submitted && errores().idPersona) {
        <small class="text-red-500">{{ errores().idPersona }}</small>
      }
    </div>
    <div>
      <label for="codigo" class="mb-1.5 block text-sm font-medium">
        Código de paciente <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        pInputText
        id="codigo"
        [(ngModel)]="paciente.codigo"
        autocomplete="off"
        maxlength="50"
        placeholder="Ej. PAC-0001"
        fluid
      />
      @if (submitted && errores().codigo) {
        <small class="text-red-500">{{ errores().codigo }}</small>
      }
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      text
      severity="secondary"
      (onClick)="hideDialog()"
      [disabled]="guardando"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="guardando"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>
