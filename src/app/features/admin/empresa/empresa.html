<p-toast />
<p-confirmdialog [style]="{ width: 'min(450px, calc(100vw - 2rem))' }" />

<app-page-header title="Empresas" subtitle="Datos institucionales de la empresa propietaria del laboratorio." icon="pi pi-building">
  <p-button label="Exportar" icon="pi pi-download" severity="secondary" [outlined]="true" (onClick)="exportCSV()" />
  <p-button label="Nuevo" icon="pi pi-plus" *appHasPermission="'create'" (onClick)="openNew()" />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-surface bg-surface-0 dark:bg-surface-900">
  <div class="flex flex-col gap-3 border-b border-surface p-3 sm:flex-row sm:items-center sm:justify-between sm:p-4">
    <p-iconfield class="w-full sm:w-80">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        class="w-full"
        aria-label="Buscar empresas"
        placeholder="Buscar empresas..."
        (input)="onGlobalFilter(dt, $event)"
      />
    </p-iconfield>
  </div>


<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="['nombre', 'nit', 'slogan', 'estado']"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} empresas"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
  selectionMode="multiple"
  [(selection)]="seleccionados"
>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="nombre" style="min-width: 16rem">
        Nombre <p-sortIcon field="nombre" />
      </th>
      <th pSortableColumn="nit" style="min-width: 10rem">
        NIT <p-sortIcon field="nit" />
      </th>
      <th pSortableColumn="slogan" style="min-width: 20rem">
        Eslogan <p-sortIcon field="slogan" />
      </th>
      <th pSortableColumn="estado" style="min-width: 8rem">
        Estado <p-sortIcon field="estado" />
      </th>
      <th style="min-width: 10rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-empresa>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="empresa" />
      </td>
      <td data-label="Nombre">{{ empresa.nombre }}</td>
      <td data-label="NIT">{{ empresa.nit }}</td>
      <td data-label="Eslogan">{{ empresa.slogan }}</td>
      <td data-label="Estado">
        <p-tag
          [value]="empresa.estado"
          [severity]="empresa.esActivo ? 'success' : 'secondary'"
        />
      </td>
      <td>
        <p-button
          icon="pi pi-pencil"
          ariaLabel="Editar"
          class="mr-2"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'update'"
          (onClick)="editEmpresa(empresa)"
        />
        <p-button
          icon="pi pi-trash"
          ariaLabel="Eliminar"
          severity="danger"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'delete'"
          (onClick)="eliminar(empresa)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="12">
        <app-empty-state
          icon="pi pi-building"
          title="Sin resultados"
          description="No hay empresas para mostrar. Ajuste la búsqueda o cree un nuevo registro."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [style]="{ width: 'min(560px, calc(100vw - 2rem))' }"
  [header]="esNuevo ? 'Nueva empresa' : 'Editar empresa'"
  [modal]="true"
>
  <div class="flex flex-col gap-5 pt-2">
    <div>
      <label for="nombre" class="mb-1.5 block text-sm font-medium">
        Nombre <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        pInputText
        id="nombre"
        [(ngModel)]="empresa.nombre"
        autocomplete="off"
        maxlength="150"
        fluid
      />
      @if (submitted && errores().nombre) {
        <small class="text-red-500">{{ errores().nombre }}</small>
      }
    </div>
    <div>
      <label for="nit" class="mb-1.5 block text-sm font-medium">
        NIT <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        pInputText
        id="nit"
        [(ngModel)]="empresa.nit"
        autocomplete="off"
        maxlength="20"
        fluid
      />
      @if (submitted && errores().nit) {
        <small class="text-red-500">{{ errores().nit }}</small>
      }
    </div>
    <div>
      <label for="slogan" class="mb-1.5 block text-sm font-medium">Eslogan</label>
      <textarea
        id="slogan"
        pTextarea
        rows="3"
        [(ngModel)]="empresa.slogan"
        maxlength="500"
        fluid
      ></textarea>
      @if (submitted && errores().slogan) {
        <small class="text-red-500">{{ errores().slogan }}</small>
      }
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      text
      severity="secondary"
      (onClick)="hideDialog()"
      [disabled]="guardando"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="guardando"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>
