<p-toast />
<p-confirmdialog [style]="{ width: 'min(450px, calc(100vw - 2rem))' }" />

<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <div class="flex flex-wrap items-center gap-2">
      <span class="font-semibold text-xl mr-2">Instituciones y convenios</span>
      <p-button
        label="Nuevo"
        icon="pi pi-plus"
        severity="secondary"
        *appHasPermission="'create'"
        (onClick)="openNew()"
      />
    </div>
  </ng-template>
  <ng-template #end>
    <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row">
      <p-iconfield class="w-full sm:w-auto">
        <p-inputicon styleClass="pi pi-search" />
        <input
          pInputText
          type="text"
          class="w-full sm:w-64"
          (input)="onGlobalFilter(dt, $event)"
          placeholder="Buscar..."
        />
      </p-iconfield>
      <p-button
        label="Exportar"
        icon="pi pi-upload"
        severity="secondary"
        (onClick)="exportCSV()"
      />
    </div>
  </ng-template>
</p-toolbar>

<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="['nombre', 'estado']"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} instituciones"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '40rem' }"
  selectionMode="multiple"
  [(selection)]="seleccionados"
>
  <ng-template #caption>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h5 class="m-0">Gestionar instituciones y convenios</h5>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="nombre" style="min-width: 24rem">
        Nombre <p-sortIcon field="nombre" />
      </th>
      <th pSortableColumn="estado" style="min-width: 8rem">
        Estado <p-sortIcon field="estado" />
      </th>
      <th style="min-width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-institucion>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="institucion" />
      </td>
      <td data-label="Nombre">{{ institucion.nombre }}</td>
      <td data-label="Estado">
        <p-tag
          [value]="institucion.estado"
          [severity]="institucion.esActivo ? 'success' : 'secondary'"
        />
      </td>
      <td>
        <p-button
          icon="pi pi-pencil"
          class="mr-2"
          [rounded]="true"
          [outlined]="true"
          *appHasPermission="'update'"
          (onClick)="editInstitucion(institucion)"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [rounded]="true"
          [outlined]="true"
          *appHasPermission="'delete'"
          (onClick)="eliminar(institucion)"
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [(visible)]="dialogVisible"
  [style]="{ width: 'min(520px, calc(100vw - 2rem))' }"
  [header]="esNuevo ? 'Nueva institución' : 'Editar institución'"
  [modal]="true"
>
  <div class="flex flex-col gap-5 pt-2">
    <div>
      <label for="nombre" class="block font-bold mb-2">
        Nombre <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        pInputText
        id="nombre"
        [(ngModel)]="nombre"
        autocomplete="off"
        maxlength="150"
        placeholder="Nombre de la institución o convenio"
        fluid
      />
      @if (submitted && errorNombre()) {
        <small class="text-red-500">{{ errorNombre() }}</small>
      }
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      text
      severity="secondary"
      (onClick)="hideDialog()"
      [disabled]="guardando"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="guardando"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>
