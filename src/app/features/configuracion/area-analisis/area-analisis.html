<p-toast />
<p-confirmdialog [style]="{ width: 'min(450px, calc(100vw - 2rem))' }" />

<app-page-header title="Áreas de análisis" subtitle="Agrupaciones de exámenes: hematología, química, etc." icon="pi pi-th-large">
  <p-button label="Exportar" icon="pi pi-download" severity="secondary" [outlined]="true" (onClick)="exportCSV()" />
  <p-button label="Nuevo" icon="pi pi-plus" *appHasPermission="'create'" (onClick)="openNew()" />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-surface bg-surface-0 dark:bg-surface-900">
  <div class="flex flex-col gap-3 border-b border-surface p-3 sm:flex-row sm:items-center sm:justify-between sm:p-4">
    <p-iconfield class="w-full sm:w-80">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        class="w-full"
        aria-label="Buscar áreas"
        placeholder="Buscar áreas..."
        (input)="onGlobalFilter(dt, $event)"
      />
    </p-iconfield>
  </div>


<p-table
  #dt
  styleClass="mobile-card-table"
  [value]="filas() ?? []"
  [columns]="cols"
  [rows]="10"
  [paginator]="true"
  [scrollable]="true"
  dataKey="id"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [globalFilterFields]="['nombre', 'areaPadre', 'estado']"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} áreas"
  [showCurrentPageReport]="true"
  [tableStyle]="{ 'min-width': '44rem' }"
  selectionMode="multiple"
  [(selection)]="seleccionados"
>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="nombre" style="min-width: 20rem">
        Nombre <p-sortIcon field="nombre" />
      </th>
      <th pSortableColumn="areaPadre" style="min-width: 16rem">
        Área padre <p-sortIcon field="areaPadre" />
      </th>
      <th pSortableColumn="estado" style="min-width: 8rem">
        Estado <p-sortIcon field="estado" />
      </th>
      <th style="min-width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-area>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="area" />
      </td>
      <td data-label="Nombre">{{ area.nombre }}</td>
      <td data-label="Área padre">{{ area.areaPadre }}</td>
      <td data-label="Estado">
        <p-tag
          [value]="area.estado"
          [severity]="area.esActivo ? 'success' : 'secondary'"
        />
      </td>
      <td>
        <p-button
          icon="pi pi-pencil"
          ariaLabel="Editar"
          class="mr-2"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'update'"
          (onClick)="editArea(area)"
        />
        <p-button
          icon="pi pi-trash"
          ariaLabel="Eliminar"
          severity="danger"
          [rounded]="true"
          [text]="true"
          *appHasPermission="'delete'"
          (onClick)="eliminar(area)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="12">
        <app-empty-state
          icon="pi pi-th-large"
          title="Sin resultados"
          description="No hay áreas para mostrar. Ajuste la búsqueda o cree un nuevo registro."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [style]="{ width: 'min(520px, calc(100vw - 2rem))' }"
  [header]="esNuevo ? 'Nueva área de análisis' : 'Editar área de análisis'"
  [modal]="true"
>
  <div class="flex flex-col gap-5 pt-2">
    <div>
      <label for="nombre" class="mb-1.5 block text-sm font-medium">
        Nombre <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        pInputText
        id="nombre"
        [(ngModel)]="nombre"
        autocomplete="off"
        maxlength="150"
        placeholder="Ej. Hematología"
        fluid
      />
      @if (submitted && errorNombre()) {
        <small class="text-red-500">{{ errorNombre() }}</small>
      }
    </div>
    <div>
      <label for="idArea" class="mb-1.5 block text-sm font-medium">Área padre</label>
      <p-select
        inputId="idArea"
        [options]="areaOptions()"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="idArea"
        placeholder="Sin área padre"
        [showClear]="true"
        appendTo="body"
        fluid
      />
      @if (errorIdArea(); as mensajeError) {
        <small class="text-red-500">{{ mensajeError }}</small>
      } @else {
        <small class="text-surface-500">
          Opcional. No se puede seleccionar el área que se está editando.
        </small>
      }
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      text
      severity="secondary"
      (onClick)="hideDialog()"
      [disabled]="guardando"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="guardando"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>
